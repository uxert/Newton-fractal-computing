services:
  frontend:
    image: uxert/newton-raphson-frontend:${VERSION:-latest}
    build:
      context: ./frontend/newton-raphson-frontend
    ports:
      - "8081:80"

  backend:
    image: uxert/newton-raphson-backend:${VERSION:-latest}
    build:
      context: ./backend
    ports:
      - "8000:8000"
